name: Reviewed release
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: '已评审的 v版本号 tag'
permissions:
  contents: write
jobs:
  release:
    environment: release-approved
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node native-host/install-windows.mjs build-only
      - run: node --test tests/*.test.js
      - run: node tools/build.mjs
      - run: node tools/package-windows.mjs
      - run: node tools/package-source.mjs
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assets = @(Get-ChildItem dist -Filter *.zip | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" @assets dist/SHA256SUMS --draft --title "$env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
