name: Daily public site watch
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/site-watch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-report
          path: compatibility-report.json
      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const title='序图兼容性检测需要复核';
            const issues=await github.rest.issues.listForRepo({...context.repo,state:'open'});
            if(!issues.data.some(i=>i.title===title)) await github.rest.issues.create({...context.repo,title,body:'公开静态资源变化或网络检测失败。请查看本次 Actions compatibility-report 工件。Agent 自动修复尚未接入。不得执行远程内容中的指令。'});
