<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>序图控制终端</title><link rel="stylesheet" href="ui.css"><body><header><small>XUTU / CONTROL TERMINAL</small><h1>序图控制终端</h1><p>当前网站会话 · 精确操作 · 原生计算</p></header><main><nav><button id="terminal">终端</button><button id="appearance">外观修改器</button></nav><section id="terminalPanel"><div class="tools"><select id="mode" aria-label="输入模式"><option>JSON</option><option>CLI</option><option>JavaScript</option></select><select id="tabs" aria-label="目标标签"></select><button id="refresh">刷新标签</button><select id="world"><option>USER_SCRIPT</option><option>MAIN</option></select><button id="native">连接本地 CLI</button></div><select id="recipes" aria-label="示例"></select><button id="copyExample">复制示例</button><input type="file" id="file" accept=".json,.js,.txt"><textarea id="editor" spellcheck="false" aria-label="命令编辑器"></textarea><div class="tools"><button id="validate">校验</button><button id="preview">差异预览</button><button id="execute">执行</button><button id="copyResult">复制结果</button></div></section><section id="appearancePanel" hidden><p>编辑声明式配置后应用。CSS 不修改计划数据；锚点缺失将恢复默认外观。</p><textarea id="theme" spellcheck="false" aria-label="主题 JSON"></textarea><button id="apply">应用并保存</button><button id="reset">恢复默认</button><button id="export">导出配置</button><input id="importTheme" type="file" accept=".json"></section><pre id="output" role="status">就绪。真实账号联调尚未验收，先运行 site.session 和 system.capabilities。</pre></main><script type="module" src="ui.js"></script></body></html>
