<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>序图终端</title><link rel="stylesheet" href="ui.css"></head>
<body><header><div><h1>序图终端</h1><p id="connection" role="status">正在连接序图…</p></div><button id="openSite" class="quiet">打开序图</button></header>
<main><div id="targetRow" hidden><label for="tabs">操作哪个网页</label><select id="tabs"></select></div>
<section><label for="request"><span class="step">1</span>告诉 AI 你想做什么</label><textarea id="request" rows="2" placeholder="例如：把连续的两项设计工作合并，保留编号和其他依赖。"></textarea><button id="copyPrompt" class="secondary">复制 AI 提示词</button><p class="hint">粘贴给你常用的 AI。提示词会带上当前计划的完整内容。</p></section>
<section><div class="label-row"><label for="editor"><span class="step">2</span>粘贴 AI 返回的指令</label><select id="mode" aria-label="指令格式"><option>JSON</option><option>CLI</option><option>JavaScript</option></select></div><textarea id="editor" rows="5" spellcheck="false" placeholder="把 AI 返回的 JSON 粘贴到这里…"></textarea><button id="execute" class="primary">一键执行</button></section>
<p id="message" role="status" aria-live="polite">准备好后，按上面两步操作。</p><details id="resultDetails" hidden><summary>查看执行结果 <button id="copyResult" class="text-button">复制</button></summary><pre id="output"></pre></details>
<details class="cli"><summary>连接本地 CLI</summary><p class="hint">使用可运行命令的外部 AI 时，安装本地宿主，再连接即可。</p><p class="hint">扩展 ID：<code id="extensionId"></code> <button id="copyId" class="text-button">复制</button></p><button id="native" class="secondary">连接 CLI</button><button id="copyCli" class="quiet">复制 CLI 用法</button><p id="cliStatus" class="hint" role="status">尚未连接</p></details>
<details class="help"><summary>第一次使用？两分钟上手</summary><ol><li>打开序图，登录并选中要修改的计划。</li><li>描述需求，复制提示词发给 AI。</li><li>把 AI 返回的指令粘回来，点击“一键执行”。</li></ol><p class="hint">不需要 API Key。只修改当前账号有权限操作的内容；执行结果会说明失败原因。</p></details>
</main><script type="module" src="ui.js"></script></body></html>
