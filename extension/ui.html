<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>序图终端</title><link rel="stylesheet" href="ui.css"></head>
<body>
<header><h1>序图终端</h1><button id="openSite" class="text-button">打开网站 ↗</button></header>
<div class="connection-strip"><span class="status-dot" aria-hidden="true"></span><p id="connection" role="status">正在连接…</p></div>
<main>
<div id="targetRow" hidden><label for="tabs">操作网页</label><select id="tabs"></select></div>
<section class="compose-card"><div class="field-heading"><div class="intent-switch" role="group" aria-label="计划操作"><button id="createPlan" type="button" aria-pressed="true">新建</button><button id="managePlan" type="button" aria-pressed="false" title="新增、删除任务及其他计划操作">管理</button></div></div><label id="requestLabel" for="request" class="visually-hidden">新建计划的需求</label><textarea id="request" rows="3" placeholder="想新建什么计划？写下目标和要求…"></textarea><div class="prompt-actions"><button id="copyPrompt" class="secondary">复制给 AI</button><button id="copyMcpPrompt" class="secondary">复制给 MCP AI</button></div><p class="key-note">MCP 提示词含密钥，仅发给可信 AI</p></section>
<section class="execute-card"><div class="field-heading"><label for="editor">执行指令</label></div><textarea id="editor" rows="6" spellcheck="false" placeholder="粘贴完整 JSON 或 Markdown JSON 代码块…"></textarea><p id="changeSummary" class="hint" role="status"></p><button id="execute" class="primary">执行</button></section>
<section id="reviewPanel" hidden><h2>请核对本次影响</h2><p id="reviewNotice"></p><pre id="reviewDiff"></pre><div class="button-row"><button id="confirmAction" class="primary">确认处理</button><button id="cancelAction">保留现状</button></div></section>
<p id="message" role="status" aria-live="polite"></p>
<div id="recoveryActions" hidden class="button-row"><button id="diagnoseRequest">检查原请求</button><button id="copyHelp">复制给 AI 求助</button></div><p id="helpPrivacy" class="hint" hidden>求助资料含计划信息，仅发给可信 AI。</p>
<details id="resultDetails" hidden><summary>执行结果 <button id="copyResult" class="text-button">复制</button></summary><pre id="output"></pre></details>
<nav class="tool-bar" aria-label="工具"><button id="loadHistory">历史记录</button><button id="pageTools">页面复制</button><button id="moreToggle"><span id="moreLabel">设置</span></button></nav>
<div id="historyBody" hidden><span id="historyCount" class="hint"></span><p id="historyNotice" class="hint"></p><label>选中记录<select id="historySelect"></select></label><label>恢复/对比位置<select id="historyPoint"><option value="after">该批次之后</option><option value="before">该批次之前</option></select></label><label>对比来源<select id="compareHistory"><option value="">网站当前状态</option></select></label><div class="button-row"><button id="comparePoint">查看差异</button><button id="restorePoint" disabled>恢复选中状态</button></div><div id="historyDiff"></div><button id="inspectPending" hidden>查看待核对批次</button><button id="resolveHistory" hidden>已核对，回读后保留网站现状</button></div>
<section id="pageToolsPanel" class="tool-panel" hidden><div class="button-row"><button id="copyPage">复制摘要</button><button id="copyDom">复制 DOM</button><button id="saveOffline">保存 HTML</button><button id="downloadDom" hidden>下载原文</button></div><p class="hint">内容可能含私密信息</p><p id="pageScope" class="hint"></p><p id="exportStatus" class="hint" role="status"></p><pre id="exportDetails" hidden></pre></section>
<section id="moreDetails" class="tool-panel" hidden><label><input type="checkbox" id="optimizeSidebar">侧栏仅点击展开</label><div class="mcp-status-row"><span id="mcpState" class="hint">MCP 未连接</span><button id="disconnectMcp" class="text-button">断开</button></div>
<section class="software-update"><p id="updateStatus" class="hint" role="status">检查更新…</p><p id="updateCheckedAt" hidden></p><p id="updateNotes" hidden></p><p id="updateInstall" hidden></p><a id="installUpdate" target="_blank" rel="noopener noreferrer" hidden>下载新版 ↗</a><button id="copyUpdate" class="secondary">复制更新指令</button></section>
<details id="compatibilityDetails" hidden><summary>兼容性与排查</summary><div class="detail-body"><p id="compatibilityStatus" class="hint" role="status">打开插件时自动检查。</p><div class="button-row"><button id="checkCompatibility">重新检查</button><button id="copyCompatibility" class="secondary">复制兼容状态</button></div><pre id="compatibilityOutput"></pre><p class="hint">只读检查，不改计划。报告不含姓名、计划内容或本机路径。</p></div></details>

</section>
<details id="manualCopy" hidden><summary>手动复制内容</summary><p class="hint">剪贴板不可用，请选中下方全部内容复制。</p><textarea id="manualCopyText" rows="6" readonly aria-label="待复制的完整内容"></textarea></details>
</main><script type="module" src="ui.js"></script></body></html>
