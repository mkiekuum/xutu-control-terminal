<section class="welcome">
<h2>用一句话操作序图</h2>
<p>先登录网站，再选择你使用的 AI。你只需要描述目标；编号、依赖和权限由统一执行器检查。</p>
<div class="tools"><button id="openSite">① 打开网站登录</button><button id="checkSite">检查登录状态</button><button id="copyMcp">复制外部 AI 接入配置</button><span id="connectionStatus" role="status">尚未检查连接</span></div>
<details><summary>② 连接 AI（兼容 Chat Completions 的服务）</summary>
<p>填写你选择的 AI 服务地址、模型及 API Key。Key 仅保存到当前浏览器会话；网页登录密码不保存在插件中。网站账号与 AI 账号分别授权。</p>
<label>服务地址（包含 /v1 等前缀）<input id="aiBase" type="url" placeholder="https://你的AI服务/v1"></label>
<label>模型名称<input id="aiModel" placeholder="服务商提供的模型名称"></label>
<label>API Key<input id="aiKey" type="password" autocomplete="off" placeholder="本机服务可留空"></label>
<button id="connectAI">授权此服务并保存连接</button><button id="disconnectAI">清除 AI 连接</button>
<p>“复制外部 AI 接入配置”用于支持本地 MCP 的 AI 客户端，需要先安装 Windows 宿主并点击“连接本地 CLI”。不是所有 AI 都支持这个接口。</p>
</details>
<label for="naturalPrompt">③ 描述你要做什么</label>
<textarea id="naturalPrompt" placeholder="例如：检查当前计划有没有重复依赖，保留编号和验收点；或者：生成一份三天完成的测试计划……"></textarea>
<label><input id="shareContext" type="checkbox">允许将当前计划内容（含名称、编号、任务与人员字段）发送给上面所填的 AI 服务</label>
<label><input id="executeAI" type="checkbox">生成后直接执行（可能修改当前账号有权操作的服务器记录）</label>
<div class="tools"><button id="generateAI">生成计划 / 修改指令</button><button id="copyUniversal">复制给其他 AI 的提示词</button></div>
<p id="aiHelp">默认只生成并预览，不写入业务。外部 AI 返回的 JSON 可粘贴到下方终端执行。</p>
</section>
